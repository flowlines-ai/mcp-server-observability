name: Validate skill

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.2.2
      - name: Validate skill
        run: python3 scripts/validate_skill.py
